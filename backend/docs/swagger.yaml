basePath: /
definitions:
  api.ChatRequest:
    properties:
      context:
        additionalProperties: {}
        type: object
      history:
        items:
          $ref: '#/definitions/chat.Message'
        type: array
      message:
        type: string
    type: object
  chat.Message:
    properties:
      content:
        type: string
      role:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for upload of patient data and LLM analysis results
  title: TrustAI API
  version: "1.0"
paths:
  /analysis:
    delete:
      description: Deletes all patient data and analysis results from the database
      produces:
      - application/json
      responses:
        "200":
          description: Deletion successful
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Deletion failed
          schema:
            type: string
      summary: Delete all patient data
      tags:
      - analysis
    post:
      consumes:
      - multipart/form-data
      description: Upload patient data and X-Ray pictures and get analysis results
        back
      parameters:
      - description: Patient data as JSON (age, gender, symptoms, history)
        in: formData
        name: formData
        required: true
        type: string
      - collectionFormat: csv
        description: X-Ray PNG images
        in: formData
        items:
          type: file
        name: image_files
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Successful analysis
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            type: string
        "500":
          description: Analysis or server error
          schema:
            additionalProperties: true
            type: object
      summary: Get AI analysis
      tags:
      - analysis
  /chat:
    post:
      consumes:
      - application/json
      description: Send a message to the medical AI assistant with optional conversation
        history and patient context
      parameters:
      - description: Chat request with message, history, and optional context
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: AI reply
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request or missing message
          schema:
            type: string
        "502":
          description: Chat service error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Chat with medical AI
      tags:
      - chat
swagger: "2.0"
