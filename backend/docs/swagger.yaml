basePath: /
definitions:
  api.AnalysisResponse:
    properties:
      image_results:
        items:
          $ref: '#/definitions/api.ImageResult'
        type: array
      model_version:
        type: string
      predictions:
        items:
          $ref: '#/definitions/api.Prediction'
        type: array
      status:
        type: string
    type: object
  api.AnalysisResultResponse:
    properties:
      analysis:
        $ref: '#/definitions/api.AnalysisResponse'
      patient:
        $ref: '#/definitions/api.PatientResponse'
      status:
        type: string
    type: object
  api.ChatRequest:
    properties:
      context:
        additionalProperties: {}
        type: object
      history:
        items:
          $ref: '#/definitions/chat.Message'
        type: array
      message:
        type: string
      model:
        type: string
    type: object
  api.ImagePrediction:
    properties:
      class:
        type: string
      confidence:
        type: number
      heatmap:
        type: string
      orthancId:
        type: string
    type: object
  api.ImageResult:
    properties:
      filename:
        type: string
      index:
        type: integer
      predictions:
        items:
          $ref: '#/definitions/api.ImagePrediction'
        type: array
    type: object
  api.PatientAnalysisResponse:
    properties:
      analysis:
        $ref: '#/definitions/api.AnalysisResponse'
      patient:
        $ref: '#/definitions/api.PatientResponse'
      status:
        type: string
    type: object
  api.PatientResponse:
    properties:
      age:
        type: integer
      gender:
        type: string
      history:
        items:
          type: string
        type: array
      id:
        type: integer
      orthancIDs:
        items:
          type: string
        type: array
      symptoms:
        items:
          type: string
        type: array
    type: object
  api.PatientSummary:
    properties:
      age:
        type: integer
      gender:
        type: string
      id:
        type: integer
    type: object
  api.Prediction:
    properties:
      class:
        type: string
      confidence:
        type: number
      reason:
        type: string
    type: object
  chat.Message:
    properties:
      content:
        type: string
      role:
        $ref: '#/definitions/chat.Role'
    type: object
  chat.Role:
    enum:
    - user
    - assistant
    - system
    type: string
    x-enum-varnames:
    - UserRole
    - AssistantRole
    - SystemRole
host: localhost:8080
info:
  contact: {}
  description: API for upload of patient data and LLM analysis results
  title: TrustAI API
  version: "1.0"
paths:
  /analysis:
    delete:
      description: Deletes all patient data, analysis results, and associated images
        from all application databases
      produces:
      - application/json
      responses:
        "200":
          description: Deletion successful
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Deletion failed
          schema:
            type: string
      summary: Delete all patient data
      tags:
      - analysis
    post:
      consumes:
      - multipart/form-data
      description: Upload patient data and X-Ray pictures and get analysis results
        back
      parameters:
      - description: Patient data as JSON (age, gender, symptoms, history)
        in: formData
        name: formData
        required: true
        type: string
      - collectionFormat: csv
        description: X-Ray PNG images
        in: formData
        items:
          type: file
        name: image_files
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Successful analysis
          schema:
            $ref: '#/definitions/api.AnalysisResultResponse'
        "400":
          description: Invalid request
          schema:
            type: string
        "500":
          description: Analysis or server error
          schema:
            additionalProperties: true
            type: object
      summary: Get AI analysis
      tags:
      - analysis
  /chat:
    post:
      consumes:
      - application/json
      description: Send a message to the medical AI assistant with patient context
      parameters:
      - description: Chat request with message, history, and context
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: AI reply
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request or missing message
          schema:
            type: string
        "502":
          description: Chat service error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Chat with medical AI
      tags:
      - chat
  /patients:
    get:
      description: Returns the patients with a persisted, completed analysis, newest
        first.
      produces:
      - application/json
      responses:
        "200":
          description: Completed analysis history
          schema:
            items:
              $ref: '#/definitions/api.PatientSummary'
            type: array
        "500":
          description: Unable to load history
          schema:
            type: string
      summary: List completed analyses
      tags:
      - history
  /patients/{id}:
    delete:
      description: Deletes a patient, their analysis, and all associated images.
      parameters:
      - description: Patient ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Deletion successful
        "400":
          description: Invalid patient ID
          schema:
            type: string
        "404":
          description: Patient or analysis not found
          schema:
            type: string
        "500":
          description: Deletion failed
          schema:
            type: string
      summary: Delete one saved analysis
      tags:
      - history
  /patients/{id}/analysis:
    get:
      description: Returns a patient and their persisted analysis for the history
        dashboard.
      parameters:
      - description: Patient ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Saved analysis
          schema:
            $ref: '#/definitions/api.PatientAnalysisResponse'
        "400":
          description: Invalid patient ID
          schema:
            type: string
        "404":
          description: Patient or analysis not found
          schema:
            type: string
      summary: Get a saved analysis
      tags:
      - history
  /patients/{id}/images/{imageID}:
    get:
      description: Proxies an original X-Ray or Grad-CAM heatmap from Orthanc after
        verifying it belongs to the patient.
      parameters:
      - description: Patient ID
        in: path
        name: id
        required: true
        type: integer
      - description: Orthanc instance ID
        in: path
        name: imageID
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: Original X-Ray or Grad-CAM heatmap
          schema:
            type: file
        "400":
          description: Invalid patient or image ID
          schema:
            type: string
        "404":
          description: Patient or image not found
          schema:
            type: string
        "502":
          description: Unable to retrieve image from Orthanc
          schema:
            type: string
      summary: Get a saved patient image
      tags:
      - history
swagger: "2.0"
