name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - run: go vet ./...
      - run: go test ./...

  modelling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modelling
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modelling/requirements.txt

      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py
      - run: python -m py_compile model.py
      - run: python -m py_compile inference.py
      - run: python -m py_compile gradcam.py
      - run: python -m py_compile reason_generator.py
      - run: python -m py_compile mock_service.py

  docker-build:
    needs: [frontend, backend, modelling]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build modelling image
        uses: docker/build-push-action@v6
        with:
          context: modelling
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

