# Baut und publiziert die Produktions-Images nach GHCR (github.com/leoniejkr/LT_project/pkgs).
#
# Auslöser: Push auf main oder manuell (workflow_dispatch).
# Images: ghcr.io/<namespace>/<repo>-backend, -frontend, -modelling (Latest + Commit-SHA).
#
# Hinweis: Funktionieren die GHCR-Login/API-Schritte nicht (z.B. Org-Policies),
# lassen sich die Pakete alternativ auf der GitHub-Website öffentlich setzen.
#
# Auf Docker Hub umstellen: Login auf docker/login-action umbauen und
# secret DockerHub USERNAME/TOKEN in den Repo-Settings anlegen.

name: Publish Production Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image namespace
        id: meta
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          echo "repo_lower=${REPO_LOWER}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: prod
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-backend:latest
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=prod-backend
          cache-to: type=gha,scope=prod-backend,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: prod
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-frontend:latest
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=prod-frontend
          cache-to: type=gha,scope=prod-frontend,mode=max

      - name: Build and push modelling
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: modelling/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-modelling:latest
            ghcr.io/${{ steps.meta.outputs.repo_lower }}-modelling:${{ github.sha }}
          cache-from: type=gha,scope=prod-modelling
          cache-to: type=gha,scope=prod-modelling,mode=max

      - name: Make GHCR packages public (best effort)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          for image in "-backend" "-frontend" "-modelling"; do
            PACKAGE="${GITHUB_REPOSITORY,,}${image}"
            echo "Setting visibility for ${PACKAGE}"
            gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/users/${OWNER}/packages/container/${PACKAGE}/visibility" \
              -f visibility=public || echo "Warning: konnte Sichtbarkeit nicht setzen für ${PACKAGE}"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}