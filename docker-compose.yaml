services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: trustai_user
      POSTGRES_PASSWORD: trustai_password
      POSTGRES_DB: trustai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  modelling:
    build: ./modelling
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - USE_MOCK=true

  backend:
    build: 
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    command: air -c air.toml
    depends_on:
      db:
        condition: service_started
      modelling:
        condition: service_started
    environment:
      DATABASE_URL: host=db user=trustai_user password=trustai_password dbname=trustai_db port=5432 sslmode=disable TimeZone=Europe/Berlin
      MODELLING_URL: http://modelling:5000
      PORT: 8080

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
    environment:
      - PUBLIC_API_URL=http://localhost:8080
      - WATCHPACK_POLLING=true

volumes:
  postgres_data:
