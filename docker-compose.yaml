services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: trustai_user
      POSTGRES_PASSWORD: trustai_password
      POSTGRES_DB: trustai_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustai_user -d trustai_db"]
      interval: 2s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql

  orthanc:
    image: orthancteam/orthanc
    ports:
      - "8042:8042"
      - "4242:4242"
    volumes:
      - orthanc_storage:/var/lib/orthanc/db:Z
    environment:
      ORTHANC__NAME: "Orthanc Database"
      ORTHANC__REGISTERED_USERS: |
        {"user": "user"}

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./src/LLM/files/clinical_model_dir:/models:ro
    # Beim Start das finetunete GGUF-Modell in Ollama registrieren
    # (Modelfile: /models/Modelfile -> FROM /models/llama-3-8b-Instruct.Q4_K_M.gguf),
    # danach den Ollama-Server starten.
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama create trustai-llm -f /models/Modelfile
        exec ollama serve

  modelling:
    build: ./modelling
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints:ro
    environment:
      - USE_MOCK=false
      - CHECKPOINT_PATH=/app/checkpoints/dual_view_checkpoint.pth
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=trustai-llm:latest
    depends_on:
      - ollama

  backend:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    command: air -c air.toml
    depends_on:
      db:
        condition: service_healthy
      modelling:
        condition: service_started
      orthanc:
        condition: service_started
    environment:
      DATABASE_URL: host=db user=trustai_user password=trustai_password dbname=trustai_db port=5432 sslmode=disable TimeZone=Europe/Berlin
      MODELLING_URL: http://modelling:5000
      ORTHANC_URL: http://orthanc:8042
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: trustai-llm:latest
      PORT: 8080

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started
    environment:
      - PUBLIC_API_URL=http://localhost:8080
      - WATCHPACK_POLLING=true

volumes:
  postgres_data:
  orthanc_storage:
  ollama_data:
